name: build

on:
  push:
    branches: [main]
  # Build-only validation on PRs (e.g. Dependabot bumps) — no push to GHCR.
  pull_request:
  # Weekly rebuild with no cache so the base image + OS/Python patches are
  # genuinely refreshed even when there are no code changes.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        # No login on PRs — those builds don't push (and fork PRs lack the token).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Build into the local daemon first so the image can actually be run before
      # anything is published. Layers are written to the Actions cache and reused
      # by the push step below, so this is one real build, not two.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: caldav-mcp:smoke
          # Refresh everything on the weekly scheduled rebuild.
          no-cache: ${{ github.event_name == 'schedule' }}
          # `ignore-error=true` because the cache export is an optimisation, not a
          # result: without it a hiccup in GitHub's cache service fails the whole
          # build *after* the image has already been built successfully. Two runs
          # building identical content race to reserve the same key and the loser
          # dies with "failed to reserve cache" — which the Monday scheduled
          # rebuild overlapping a push reproduces exactly. A cache miss should
          # cost a slower build, never a red run.
          cache-to: type=gha,mode=max,ignore-error=true
          cache-from: type=gha

      # `docker build` succeeding proves only that the image assembles. This runs
      # a real MCP handshake against the container over a proxied Host header,
      # which is what catches a server that binds the wrong interface or rejects
      # Pomerium's Host header with 421 — both of which build and report healthy.
      - name: Smoke test
        run: ./scripts/smoke_test.sh caldav-mcp:smoke

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Push everywhere except PRs, where we only validate that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
